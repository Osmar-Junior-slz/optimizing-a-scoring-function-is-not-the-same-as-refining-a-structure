[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docking-confidence-standalone"
version = "0.8.0"
description = "Auditable reduced versus full docking and local refinement with Venn-Abers/LTT."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "PyYAML>=6.0",
  "streamlit>=1.63",
  "pydantic>=2,<3",
  "matplotlib>=3.7",
  "tqdm>=4.65"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
docking-confidence = "docking_confidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dockingpp = ["configs/*.yaml", "_standalone_manifest.json"]
"docking_confidence.adapters" = ["factorial_v5.bundle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
